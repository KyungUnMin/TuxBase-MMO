services:
  mainserver:
    container_name: tuxbase-mainserver
    image: ${IMAGE_NAME:?IMAGE_NAME is not set (see .env)}
    ports:
      - "13000:13000"
    environment:
      - CLAUDE_CONFIG_DIR=/root/.claude
    volumes:
      - ../Src:/root/src
      - ../../03_Share:/root/share
      - ./claude-data/mainserver:/root/.claude
      - ./server/vscode-overlay/tasks.json:/root/src/.vscode/tasks.json
      - ./server/vscode-overlay/launch.json:/root/src/.vscode/launch.json
    command: sleep infinity

  dummyclient:
    container_name: tuxbase-dummyclient
    image: ${IMAGE_NAME:?IMAGE_NAME is not set (see .env)}
    environment:
      - CLAUDE_CONFIG_DIR=/root/.claude
    volumes:
      - ../Src:/root/src
      - ../../03_Share:/root/share
      - ./claude-data/dummyclient:/root/.claude
      - ./dummyclient/vscode-overlay/tasks.json:/root/src/.vscode/tasks.json
      - ./dummyclient/vscode-overlay/launch.json:/root/src/.vscode/launch.json
    depends_on:
      - mainserver
    command: sleep infinity
